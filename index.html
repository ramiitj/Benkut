<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Benkut - Kitchen & Market Companion</title>
    <meta name="description" content="Hands-free voice kitchen assistant and market companion supporting pantry management, smart shopping, countertop voice cooking, and full Telugu localization." />
    <meta property="og:title" content="Benkut - Kitchen & Market Companion" />
    <meta property="og:description" content="Hands-free voice kitchen assistant and market companion supporting pantry management, smart shopping, countertop voice cooking, and full Telugu localization." />
    <meta name="theme-color" content="#174F35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Benkut" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#FDE047', // Sunny Yellow
                hover: '#FACC15',
                content: '#422006',
              },
              herb: {
                DEFAULT: '#15803d', // Herb Green
                light: '#DCFCE7',
                mint: '#BBF7D0',
              },
              stone: {
                50: '#FAFAF9',
                100: '#F5F5F4',
                200: '#E7E5E4',
                800: '#292524',
                900: '#1c1917',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
            },
            boxShadow: {
              'soft': '0 20px 40px -4px rgba(253, 224, 71, 0.15), 0 8px 16px -4px rgba(0, 0, 0, 0.05)',
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #E7E5E4;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D6D3D1;
      }
      .fill-icon {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      :root { --benkut-radius-card: 2rem; --benkut-radius-control: .875rem; --benkut-space-page: clamp(1.25rem, 4vw, 2.5rem); --benkut-focus: #166534; }
      :focus-visible { outline: 3px solid var(--benkut-focus); outline-offset: 3px; }
      .benkut-card { background: white; border: 1px solid #e7e5e4; border-radius: var(--benkut-radius-card); padding: 1.5rem; box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
      .benkut-button { min-height: 44px; border-radius: var(--benkut-radius-control); background: #1c1917; color: white; padding: .65rem 1rem; font-weight: 700; }
      .benkut-button:disabled { background: #d6d3d1; color: #57534e; cursor: not-allowed; }
      .status-chip { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid #d6d3d1; border-radius: 999px; padding: .35rem .7rem; color: #44403c; background: #fafaf9; font-size: .75rem; font-weight: 700; }
      @keyframes laserScan {
        0% { top: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { top: 96%; opacity: 0; }
      }
      .animate-laser-scan {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #DFF36C, #22c55e, #DFF36C, transparent);
        box-shadow: 0 0 16px 3px rgba(223, 243, 108, 0.7), 0 0 30px 6px rgba(34, 197, 94, 0.4);
        animation: laserScan 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-900 font-sans antialiased selection:bg-primary selection:text-primary-content">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
